<!DOCTYPE html>
<html lang="ru" data-t="light" data-skin="pixel" data-pal="mint">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>cdn/split · ledger</title>
  
  <!-- Early theme/skin initialization to prevent FOUC -->
  <script>
    try {
      var h = document.documentElement;
      var sk = localStorage.getItem('cs-skin') || 'pixel';
      var pl = localStorage.getItem('cs-pal');
      var th = localStorage.getItem('cs-theme') || 'auto';
      var dm = { pixel: 'mint', air: 'sky', orbit: 'lilac' };
      h.dataset.skin = sk;
      h.dataset.pal = (pl && { mint: 1, sky: 1, lilac: 1, peach: 1, graphite: 1 }[pl]) ? pl : dm[sk];
      h.dataset.t = th === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : th;
    } catch (e) {}
  </script>

  <!-- PWA & Brand Assets (Relative paths for localhost & GitHub Pages) -->
  <link rel="icon" href="./brand-assets/favicon.ico" sizes="48x48">
  <link rel="icon" href="./brand-assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./brand-assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./brand-assets/apple-touch-icon.png">
  <link rel="manifest" href="./brand-assets/manifest.webmanifest">
  <meta name="theme-color" content="#f1f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151c17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="cdn/split">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./static/css/tokens.css">
  <link rel="stylesheet" href="./static/css/layout.css">
  <link rel="stylesheet" href="./static/css/skins.css">
</head>
<body>
  <!-- Startup Splash Intro Screen -->
  <div id="splash">
    <div class="sp-in">
      <svg class="lg intro" viewBox="0 0 32 32" width="92" height="92" aria-hidden="true">
        <rect class="tile" width="32" height="32" rx="9"/>
        <circle class="ring" cx="16" cy="16" r="10" fill="none" stroke-width="1.5"/>
        <g class="rot">
          <path class="h1" d="M16 6a10 10 0 0 0 0 20z"/>
          <path class="h2" d="M16 6a10 10 0 0 1 0 20z"/>
        </g>
      </svg>
      <div class="sp-wm">cdn<em>/</em>split</div>
      <div class="sp-tag">Делим CDN по-честному</div>
    </div>
  </div>

  <!-- Header & Navigation -->
  <header class="top">
    <div class="top-in">
      <div class="logo" data-a="logo" title="cdn/split">
        <svg class="lg lgm" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect class="tile" width="32" height="32" rx="9"/>
          <circle class="ring" cx="16" cy="16" r="10" fill="none" stroke-width="1.5"/>
          <g class="rot">
            <path class="h1" d="M16 6a10 10 0 0 0 0 20z"/>
            <path class="h2" d="M16 6a10 10 0 0 1 0 20z"/>
          </g>
        </svg>
        <span class="wm">cdn<em>/</em>split</span>
      </div>
      <nav class="topnav" id="topnav"></nav>
      <div class="sp"></div>
      <button class="chip sq" id="skinbtn" data-a="skinCycle" title="Оформление: стиль, цвет, тема"></button>
      <button class="iconbtn" id="thbtn" data-a="themeToggle" title="Светлая / тёмная тема">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button class="chip" id="mechip" data-a="me" title="Смотрю как — переключить участника"></button>
      <button class="chip sq" data-a="refresh" title="Обновить данные из API">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>
        </svg>
        <span class="t" id="fresh"></span>
      </button>
    </div>
  </header>

  <!-- Sidebar (used in Orbit skin on screens >= 900px) -->
  <aside id="side">
    <div class="logo" data-a="logo" title="cdn/split">
      <svg class="lg lgm" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect class="tile" width="32" height="32" rx="9"/>
        <circle class="ring" cx="16" cy="16" r="10" fill="none" stroke-width="1.5"/>
        <g class="rot">
          <path class="h1" d="M16 6a10 10 0 0 0 0 20z"/>
          <path class="h2" d="M16 6a10 10 0 0 1 0 20z"/>
        </g>
      </svg>
      <span class="wm">cdn<em>/</em>split</span>
    </div>
    <nav id="sidenav"></nav>
    <div class="side-b" id="sideb"></div>
  </aside>

  <!-- Main Application Content Container -->
  <main class="wrap" id="app"></main>

  <!-- Sticky Bottom Settlement Bar on Mobile -->
  <div class="sbar" id="sbar"></div>

  <!-- Mobile Bottom Tabbar -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- Modal / Bottom-Sheet Layer and Toast Notifications Container -->
  <div id="layer"></div>
  <div id="toastbox"></div>

  <!-- Application Entry Script -->
  <script type="module" src="./static/js/main.js"></script>
</body>
</html>
